<!doctype html>
<!--
  Adversarial regression fixture: a generic validation-style phrase ("this
  field is required") is already present on the page BEFORE the submit
  click, as static helper text near an unrelated optional field -- exactly
  the kind of boilerplate a real form carries regardless of whether anything
  was ever submitted. Clicking submit changes nothing. The classifier must
  not treat the pre-existing phrase as proof this attempt was rejected --
  the correct result is UNCERTAIN, not CONFIRMED_FAILURE.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Fixture Role at Fixture Co</title></head>
<body>
  <form id="application_form" action="https://job-boards.greenhouse.io/fixtureco/jobs/1/application" method="get"
        onsubmit="window.__submitAttempts = (window.__submitAttempts || 0) + 1; return false;">
    <label for="first_name">First Name*</label>
    <input type="text" id="first_name" value="Ada" required>

    <label for="last_name">Last Name*</label>
    <input type="text" id="last_name" value="Lovelace" required>

    <label for="email">Email*</label>
    <input type="email" id="email" value="ada@example.com" required>

    <label for="referral">How did you hear about us?</label>
    <input type="text" id="referral">
    <p class="hint">This field is required for some roles; leave blank if not applicable.</p>

    <button type="submit">Submit application</button>
  </form>
</body>
</html>
