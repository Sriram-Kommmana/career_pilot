<!doctype html>
<!--
  A regression/behaviour fixture for Phase 6's outcome classifier. Clicking the
  submit control does nothing observable at all — no navigation, no DOM
  change, no recognisable text — simulating an AJAX-style submission whose
  real-world outcome never surfaces anything this adapter recognises within
  its timeout. Used to prove the classifier defaults to UNCERTAIN rather than
  guessing, which is the safe default this fixture exists to pin down.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Fixture Role at Fixture Co</title></head>
<body>
  <form id="application_form" action="https://job-boards.greenhouse.io/fixtureco/jobs/1/application" method="get"
        onsubmit="window.__submitAttempts = (window.__submitAttempts || 0) + 1; return false;">
    <label for="first_name">First Name*</label>
    <input type="text" id="first_name" value="Ada" required>

    <label for="last_name">Last Name*</label>
    <input type="text" id="last_name" value="Lovelace" required>

    <label for="email">Email*</label>
    <input type="email" id="email" value="ada@example.com" required>

    <button type="submit">Submit application</button>
  </form>
  <p>We're processing your request.</p>
</body>
</html>
