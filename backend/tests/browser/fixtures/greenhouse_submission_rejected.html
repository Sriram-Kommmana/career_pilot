<!doctype html>
<!--
  A regression/behaviour fixture for Phase 6's outcome classifier. Clicking the
  submit control runs the form's own client-side validation, which visibly
  rejects the attempt (a recognised rejection marker appears, no navigation
  occurs) without ever reaching a server — simulating the one case this
  adapter is confident enough to call CONFIRMED_FAILURE: the employer's own
  page blocked the attempt in front of us, so nothing was sent.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Fixture Role at Fixture Co</title></head>
<body>
  <form id="application_form" action="https://job-boards.greenhouse.io/fixtureco/jobs/1/application" method="get"
        onsubmit="window.__submitAttempts = (window.__submitAttempts || 0) + 1; document.getElementById('validation_error').textContent='This field is required'; return false;">
    <label for="first_name">First Name*</label>
    <input type="text" id="first_name" value="Ada" required>

    <label for="last_name">Last Name*</label>
    <input type="text" id="last_name" value="Lovelace" required>

    <label for="email">Email*</label>
    <input type="email" id="email" value="ada@example.com" required>

    <button type="submit">Submit application</button>
  </form>
  <span id="validation_error"></span>
</body>
</html>
