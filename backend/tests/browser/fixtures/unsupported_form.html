     refuse this, not guess. -->
<html lang="en">
<head><meta charset="utf-8"><title>Some Other ATS</title></head>

  <form id="other_ats_form">

    <input type="text" id="candidate_contact">
    <button type="submit">Send</button>
  </form>
</body>
</html>
